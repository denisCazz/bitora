name: Build image & deploy

# Builds the Docker image on GitHub's runners instead of the VPS, pushes it to
# GHCR and asks Coolify to pull it. The VPS only downloads and restarts, so the
# other sites on the same server are no longer starved of CPU/RAM by a build.
#
# Setup (once):
#   1. Coolify app -> source type "Docker Image": ghcr.io/<owner>/bitora:latest
#      (private package: add GHCR credentials in Coolify, or make it public).
#   2. Repo secrets: COOLIFY_WEBHOOK (app -> Webhooks -> Deploy Webhook URL)
#      and COOLIFY_TOKEN (Keys & Tokens -> API token with deploy permission).
#   3. Coolify: turn off "Auto Deploy" for this app, otherwise each push also
#      triggers a build on the VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK not set: image pushed, deploy it from Coolify."
            exit 0
          fi
          curl -fsS --retry 3 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
